<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CK Makam</title>
<meta name="description" content="Tarayıcıda darbuka ve bağlama ile müzik yap. Makamlar, usuller, loop ve MP3, WAV, stem indirme. Ücretsiz.">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <img src="assets/logo.svg" alt="CK Makam" class="logo">
  <div class="transport">
    <button id="play" class="big">Çal</button>
    <label class="tempo">BPM <input id="bpm" type="number" min="60" max="180" value="100"></label>
    <input id="bpmRange" type="range" min="60" max="180" value="100" aria-label="Tempo">
    <button id="lang" class="ghost" title="Language">EN</button>
  </div>
</header>

<main>
  <section class="panel" id="drumPanel">
    <div class="panel-head">
      <h2>Darbuka</h2>
      <label><span data-i18n="usul">Usul</span>
        <select id="usul"></select>
      </label>
      <label><span data-i18n="bars">Ölçü</span> <select id="bars"><option>1</option><option selected>2</option><option>4</option></select></label>
      <button id="clearDrums" class="ghost" data-i18n="clear">Temizle</button>
      <label class="vol"><span data-i18n="vol">Ses</span> <input type="range" id="volDrums" min="0" max="1.2" step="0.01" value="0.9"></label>
    </div>
    <div id="legend" class="legend"></div>
    <div id="grid" class="grid"></div>
  </section>

  <section class="panel" id="baglamaPanel">
    <div class="panel-head">
      <h2>Bağlama</h2>
      <label><span data-i18n="makam">Makam</span> <select id="makam"></select></label>
      <label><span data-i18n="tonic">Karar</span> <select id="shift"></select></label>
      <label><span data-i18n="strings">Tel</span> <select id="strings"></select></label>
      <label><input type="checkbox" id="smart" checked> <span data-i18n="smart">Akıllı dizi</span></label>
      <label class="vol"><span data-i18n="vol">Ses</span> <input type="range" id="volBaglama" min="0" max="1.2" step="0.01" value="0.9"></label>
    </div>
    <div class="rec-row">
      <button id="rec" class="rec" data-i18n="record">Kayıt</button>
      <label><input type="checkbox" id="quantize" checked> <span data-i18n="quantize">Gride yapış</span></label>
      <button id="undo" class="ghost" data-i18n="undo">Geri al</button>
      <button id="clearNotes" class="ghost" data-i18n="clear">Temizle</button>
      <span id="noteCount" class="muted"></span>
    </div>
    <div id="keys" class="keys"></div>
  </section>

  <section class="panel" id="exportPanel">
    <div class="panel-head">
      <h2 data-i18n="export">İndir</h2>
      <label><span data-i18n="loops">Tekrar</span> <select id="repeats"><option>1</option><option>2</option><option selected>4</option><option>8</option></select></label>
    </div>
    <div class="export-row">
      <button data-export="mp3">MP3 320</button>
      <button data-export="wav">WAV</button>
      <button data-export="stems">Stems (ZIP)</button>
      <span id="exportStatus" class="muted"></span>
    </div>
  </section>
</main>

<footer>
  <details>
    <summary data-i18n="credits">Emeği geçenler</summary>
    <p data-i18n-html="creditsBody"></p>
    <p>Doumbek: <a href="https://freesound.org/people/gregstullsoundlab/packs/16580/">gregstullsoundlab</a>, bağlama: <a href="https://freesound.org/people/fcerim/packs/40093/">fcerim</a> (Freesound, CC0). MP3: <a href="https://github.com/zhuker/lamejs">lamejs</a> / <a href="https://lame.sourceforge.io/">LAME</a> (LGPL).</p>
  </details>
  <p class="muted" data-i18n="tagline">Ücretsiz. Her şey tarayıcında çalışır, hiçbir veri gönderilmez.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
